version: "3.9"

services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: insurance_backend111

    ports:
      - "8000:8000"

    env_file:
      - .env.docker

  frontend:
  
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: insurance_frontend111

    ports:
      - "8501:8501"

    depends_on:
      - backend

    env_file:
      - .env.docker